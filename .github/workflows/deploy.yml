name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # public/CNAME varsa canlı site: 3D site alan adının kökünden yayınlanır (slimwell.com.tr).
      # Yoksa önizleme: klasik site /react-bits-app/, 3D site /react-bits-app/3d/ altında.
      - run: |
          if [ -f public/CNAME ]; then npm run build:live; else BASE_PATH=/react-bits-app/ npm run build; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
